name: Update gold macro factors

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-factors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run classifier tests
        run: node scripts/test_classifier.mjs

      - name: Fetch data + news and regenerate factors.json / history.json
        run: node scripts/update_factors.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "gold-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add factors.json history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update gold macro factors [skip ci]"
            git pull --rebase
            git push
          fi
